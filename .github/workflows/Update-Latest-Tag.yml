name: Update Latest Tag
# Automatically handle releases and tags for this repository

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  UPDATE_TAGS_TOKEN: ${{ secrets.UPDATE_TAGS_TOKEN }}
  HOST: https://github.com
  REPO: doctor-smith/axions

permissions:
  contents: write

concurrency:
  group: update-latest-tag
  cancel-in-progress: false

jobs:
  release-handling:
    runs-on: windows-latest

    steps:
      - name: Find and delete Release with the 'latest' tag
        run: |
          $resp = gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" --hostname ${{ env.HOST }} /repos/${{ env.REPO }}/releases/tags/latest | ConvertFrom-Json
          $id = $resp.id
          gh api --method DELETE -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" --hostname ${{ env.HOST }} /repos/${{ env.REPO }}/releases/$id
      - name: Delete the 'latest' tag
        run: |
          gh api --method DELETE -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" --hostname ${{ env.HOST }} /repos/${{ env.REPO }}/git/refs/tags/latest
      - name: Find the now latest Release and create new one with incremented version number
        run: |
          $resp = gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" --hostname ${{ env.HOST }} /repos/${{ env.REPO }}/releases/latest | ConvertFrom-Json
          $prev_tag = $resp.tag_name
          $prev_version_number = [int]$prev_tag.Substring(1)
          $new_version_number = $prev_version_number + 1
          $new_tag = [string]$new_version_number
          $new_tag = "v$new_tag"
          gh api --method POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" --hostname ${{ env.HOST }} /repos/${{ env.REPO }}/releases -f "tag_name=$new_tag" -f "name=$new_tag"
      - name: Create a Release with the 'latest' tag
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" --hostname ${{ env.HOST }} /repos/${{ env.REPO }}/releases -f "tag_name=latest" -f "name=latest"
            
